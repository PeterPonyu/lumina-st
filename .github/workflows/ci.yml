name: CI

on:
  push:
    branches: [ main, "ref/**", "fix/**", "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install lint tooling
      run: |
        python -m pip install --upgrade pip
        pip install "ruff>=0.4" mypy

    - name: Ruff lint (src + tests)
      run: |
        ruff check src/ tests/

    - name: Ruff format check
      run: |
        ruff format --check src/ tests/

    # Type-check lane. The package declares `strict = true` mypy config but the
    # source tree is not yet fully annotated (~150 strict errors across 35 files,
    # mostly missing-annotation + untyped third-party stubs). Sweeping those is a
    # separate, larger effort, so this lane is informational (non-blocking) for
    # now. Follow-up: drive strict mypy to zero and drop `continue-on-error`.
    - name: Mypy type-check (non-blocking)
      continue-on-error: true
      run: |
        pip install -e ".[dev,scvi,viz]"
        mypy src/lumina_st

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install package and test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,scvi,viz]"

    # Verify collection succeeds independently before running tests — this
    # catches import errors early and makes the failure mode obvious (issue #117).
    - name: Verify test collection (no PYTHONPATH, no extra install)
      run: |
        python -m pytest --collect-only -q

    - name: Run tests
      run: |
        python -m pytest -q --tb=short

    - name: Run bounded synthetic E2E smoke
      run: |
        python scripts/e2e/verify_lumina_pipeline.py
