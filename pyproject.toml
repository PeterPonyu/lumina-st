[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "lumina-st"
dynamic = ["version"]
description = "Illuminating Latent Priors for High-Fidelity Pan-Cancer Spatial Transcriptomics Enhancement"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Zeyu Fu Lab", email = "zeyufu@ustc.edu.cn" }  # placeholder - update with real
]
keywords = [
  "spatial-transcriptomics",
  "single-cell",
  "generative-ai",
  "flow-matching",
  "latent-diffusion",
  "bioinformatics",
  "cancer",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

dependencies = [
  "torch>=2.4",
  "numpy>=1.26",
  "pandas>=2.2",
  "anndata>=0.10",
  "scanpy>=1.10",
  "scikit-image>=0.22",
  "pydantic>=2.8",
  "tqdm",
  "einops",
  "torchdiffeq",
  "pytorch_lightning>=2.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.15,<0.16",
  "mypy",
  "pre-commit",
  "lightning>=2.4",
  "wandb",
]
scvi = ["scvi-tools>=1.2"]
viz = ["matplotlib", "seaborn", "plotly"]

[project.scripts]
lumina-train-encoder = "lumina_st.cli:train_encoder"
lumina-run-enhance = "lumina_st.cli:run_enhancement"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/lumina_st"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# src-layout: make `import lumina_st` work on a fresh checkout without an
# editable install. Without this, pytest cannot collect the suite out of the
# box (see issue #96). Pytest prepends these paths to sys.path at startup.
pythonpath = ["src"]
