# Example LuminaST training config for a COAD reference-atlas run (#280).
#
# Usage:
#   python scripts/e2e/train_latent_flow.py \
#       --data data/baselines/st_impute_ref/processed_data/st_COAD_test.h5ad \
#       --config configs/lumina_coad.yaml
#
# Every key below is a field on LuminaSTConfig (src/lumina_st/config/lumina_config.py).
# The loader rejects unknown/misspelled keys with an actionable error, so this
# file doubles as the authoritative example of the accepted schema. --seed and
# --max-epochs passed on the CLI override the values here.

# Experiment identity
experiment_name: lumina_coad
seed: 42

# Cancer handling
cancer_types: ["COAD"]

# Latent encoder (scVI VAE; vae_batch_key must name the .obs cancer-label column)
latent_encoder_backend: scvi
latent_dim: 50
vae_batch_key: cancer_type
freeze_vae_encoder: true

# LuminaTransformer architecture
hidden_size: 256
depth: 8
num_heads: 8
mlp_ratio: 4.0
class_dropout_prob: 0.1

# Flow-matching training
path_type: linear
prediction: velocity
lr: 2.0e-4
warmup_steps: 200
lr_schedule: cosine
batch_size: 128
num_workers: 4
max_epochs: 100
gradient_clip_val: 1.0
early_stopping_patience: 10

# Sampling / inference
guidance_scale: 3.0
t_forward: 0.5
sampling_method: dopri5
num_sampling_steps: 50

# Output
output_dir: results
